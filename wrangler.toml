name = "my-docuseal"
main = "worker/index.js"
compatibility_date = "2026-05-06"

[vars]
POLAR_API_BASE = "https://api.polar.sh"
POLAR_ENV = "live"
# Optional product IDs from your Polar dashboard (Workers -> Settings -> Variables).
# If omitted, the Worker creates matching one-time Polar products on demand.
# POLAR_PRODUCT_STARTER_MONTHLY = ""
# POLAR_PRODUCT_STARTER_YEARLY = ""
# POLAR_PRODUCT_TEAM_MONTHLY = ""
# POLAR_PRODUCT_TEAM_YEARLY = ""
# POLAR_PRODUCT_SCALE_MONTHLY = ""
# POLAR_PRODUCT_SCALE_YEARLY = ""

# Store one live Polar key as a Worker secret:
# wrangler secret put API_PROD_KEY
# Accepted aliases: POLAR_API_KEY or account Secrets Store binding POLAR_KEY.

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/*"
]

[[d1_databases]]
binding = "DB"
# Shared production analytics D1. Rows are isolated by site_key.
database_name = "openclaw-launch"
database_id = "5c31068a-d85a-4c83-9efe-01e2de1ad22b"
